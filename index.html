<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gobierno Corporativo como mitigador de riesgo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2A44;--mute:#4D5B78;--bg:#F5F9FF;--line:#DCE6F5;--head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
header,main{max-width:1200px;margin:0 auto;padding:0 24px}
header{padding-top:32px}
h1{font:700 clamp(30px,4.5vw,52px)/1.05 var(--head);margin:0 0 6px}
.subtitle{margin:0;color:var(--mute);max-width:70ch}
.tabs{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
.tab,.btn,.item{font-family:inherit;cursor:pointer;color:var(--ink)}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 20px;font-weight:600;font-size:16px;transition:background .2s}
.tab[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding-bottom:48px}
.lead{max-width:75ch;color:var(--mute);margin:14px 0 20px}
.pillars{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pillar{background:var(--bg2);color:var(--fg);border:3px solid transparent;border-radius:24px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-family:inherit;transition:transform .2s,border-color .2s}
.pillar:hover{transform:translateY(-3px)}
.pillar[aria-pressed=true]{border-color:var(--fg);transform:translateY(-5px)}
.pillar svg{width:88px;height:88px}
.pillar .tag{font-size:15px;font-weight:600}
.pillar h2{font:700 25px/1.1 var(--head);margin:0}
.pillar small{font-size:15px;color:var(--ink)}
.panel{margin-top:22px;display:grid;grid-template-columns:minmax(250px,350px) 1fr;gap:22px;background:#fff;border:2px solid var(--line);border-radius:28px;padding:24px}
.intro{margin:0 0 14px;color:var(--mute);font-size:16px}
.items{display:flex;flex-direction:column;gap:8px}
.item{text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 16px;font-weight:600;font-size:17px;transition:background .2s,border-color .2s}
.item:hover{border-color:var(--fg)}
.item[aria-pressed=true]{background:var(--bg2);color:var(--fg);border-color:var(--fg)}
.def{background:var(--bg2);border-radius:22px;padding:28px;display:flex;flex-direction:column}
.def h3{font:700 clamp(24px,3vw,36px)/1.1 var(--head);color:var(--fg);margin:0 0 12px}
.def p{font-size:20px;margin:0 0 14px;max-width:62ch}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.steps span{background:var(--fg);color:#fff;border-radius:999px;padding:6px 16px;font-weight:600;font-size:16px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:14px;flex-wrap:wrap}
.count{font-size:15px;font-weight:600;color:var(--fg)}
.btns{display:flex;gap:8px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 18px;font-weight:600;font-size:16px}
.btn.go{background:var(--ink);color:#fff}
.close{margin-top:22px;background:#fff;border:2px dashed var(--line);border-radius:20px;padding:18px 24px;font-size:19px}
.fade{animation:f .25s}
@keyframes f{from{opacity:.2;transform:translateY(6px)}}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media(max-width:820px){.panel{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
<h1>Gobierno Corporativo como mitigador de riesgo</h1>
<p class="subtitle">Elige un pilar y recorre sus componentes. También puedes usar las flechas ← → del teclado.</p>
<div class="tabs" id="tabs" role="tablist"></div>
</header>
<main>
<p class="lead" id="lead"></p>
<div class="pillars" id="pillars"></div>
<section class="panel" id="panel">
<div><p class="intro" id="intro"></p><div class="items" id="items"></div></div>
<div class="def fade" id="def" aria-live="polite"></div>
</section>
<p class="close" id="close" hidden>Un gobierno corporativo sólido reduce el conflicto de agencia, genera confianza en el mercado y facilita el acceso a capital.</p>
</main>
<script>
const S=(b)=>`<svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
const IC={
ag:S('<path d="M48 14v62M30 80h36M20 28h56"/><path d="M20 28 8 54h24zM76 28 64 54h24z" fill="currentColor" fill-opacity=".2"/><circle cx="48" cy="14" r="4" fill="currentColor"/>'),
ca:S('<ellipse cx="48" cy="48" rx="20" ry="14" fill="currentColor" fill-opacity=".2"/><g fill="currentColor"><circle cx="48" cy="22" r="6"/><circle cx="22" cy="34" r="6"/><circle cx="74" cy="34" r="6"/><circle cx="22" cy="62" r="6"/><circle cx="74" cy="62" r="6"/><circle cx="48" cy="74" r="6"/></g>'),
ge:S('<path d="M12 82h72"/><g fill="currentColor" fill-opacity=".2"><rect x="20" y="58" width="14" height="24"/><rect x="41" y="46" width="14" height="36"/><rect x="62" y="34" width="14" height="48"/></g><path d="M18 38 38 26l16 6 22-20M64 12h12v12"/>'),
su:S('<path d="M12 82V66h22V50h22V34h28v48z" fill="currentColor" fill-opacity=".2"/><circle cx="70" cy="18" r="7" fill="currentColor"/>'),
ac:S('<circle cx="48" cy="48" r="30" fill="currentColor" fill-opacity=".2"/><path d="M48 48V18A30 30 0 0 1 75.7 59.5z" fill="currentColor"/>'),
tr:S('<circle cx="42" cy="42" r="22" fill="currentColor" fill-opacity=".15"/><path d="M58 58 82 82M32 38h20M32 48h14"/>')
};
const D=[
{tab:'Lienzo 1: Mitigador de riesgo',lead:'El riesgo de agencia aparece cuando quien administra no actúa en el interés de quien aporta el capital. El gobierno corporativo lo mitiga con un consejo capaz, una gerencia evaluada y una sucesión planificada.',
pillars:[
{ic:'ag',bg:'#FFE3DD',fg:'#B23A26',tag:'El riesgo',name:'Riesgo de agencia',intro:'Intereses distintos e información desigual entre el principal (dueños) y el agente (administradores).',items:[
{t:'Conflicto de interés',d:'Situación en que un consejero o directivo puede obtener un beneficio personal que choca con el interés de la entidad, por ejemplo contratar a una empresa propia o relacionada.'},
{t:'Gestión de conflictos',d:'Política para identificar, declarar y registrar los conflictos. La persona afectada se abstiene de votar y las operaciones con partes relacionadas se aprueban en condiciones de mercado.'}]},
{ic:'ca',bg:'#D9F2EC',fg:'#0F7A68',tag:'Cómo se mitiga',name:'Consejo de Administración',intro:'Órgano que supervisa a la gerencia y protege los intereses de los accionistas.',items:[
{t:'Aptitud y honorabilidad',d:'Requisitos para ser consejero: trayectoria íntegra, sin antecedentes que afecten la confianza, y solvencia moral y económica verificable.'},
{t:'Actualización y capacitación',d:'Inducción y formación continua en negocio, riesgos, finanzas y regulación, para que el consejo decida con criterio vigente.'},
{t:'Conocimiento y experiencia',d:'Composición con perfiles complementarios (financiero, legal, riesgos, sector) y consejeros independientes que aportan una visión objetiva.'},
{t:'Comités de gobierno',d:'Órganos de apoyo del consejo, como auditoría, riesgos, nombramientos y retribuciones. Profundizan los temas y reportan al pleno.'},
{t:'Funcionamiento del CA',d:'Reglamento interno, calendario de sesiones, información previa, actas, rol del presidente y evaluación periódica del propio consejo.'}]},
{ic:'ge',bg:'#FFF1C9',fg:'#8A5A00',tag:'Cómo se mitiga',name:'Gerencia',intro:'Ejecuta la estrategia y responde ante el consejo por sus resultados y su conducta.',items:[
{t:'Eficiencia',d:'Capacidad de ejecutar la estrategia aprobada usando los recursos de forma óptima y cumpliendo presupuestos y objetivos.'},
{t:'Evaluación del desempeño',d:'Medición periódica de la gerencia frente a metas e indicadores (KPI) acordados con el consejo.'},
{t:'Remuneración e incentivos',d:'Esquema de pago fijo y variable ligado a resultados y al riesgo asumido a largo plazo, para que gerentes y dueños persigan el mismo objetivo.'},
{t:'Sanciones',d:'Consecuencias previstas en políticas y contratos ante incumplimientos, faltas éticas o daños a la entidad.'},
{t:'Remoción',d:'Causales y procedimiento claros, aprobados por el consejo, para separar a un gerente de su cargo.'},
{t:'Planes de eventos',d:'Planes de contingencia ante crisis, fallas o ausencia repentina de directivos, para mantener la continuidad de la operación.'}]},
{ic:'su',bg:'#E2E4FF',fg:'#4A4FC4',tag:'Cómo se mitiga',name:'Sucesión',intro:'Evita vacíos de poder y dependencia de una sola persona.',items:[
{t:'Políticas de sucesión',d:'Plan formal para reemplazar a consejeros y alta gerencia. Identifica talento interno, define criterios de selección, prepara a los candidatos y organiza una transición ordenada que asegura la continuidad.',steps:['Identificar','Formar','Evaluar','Relevo']}]}]},
{tab:'Lienzo 2: Accionistas y transparencia',lead:'Los accionistas son quienes confían el capital; la transparencia es la herramienta con la que pueden vigilar a quienes lo administran.',close:1,
pillars:[
{ic:'ac',bg:'#D6EEFB',fg:'#12709E',tag:'Quienes aportan el capital',name:'Accionistas',intro:'Su protección sostiene la confianza en la entidad.',items:[
{t:'Trato equitativo',d:'Todos los accionistas de una misma clase reciben igual trato, y los minoritarios cuentan con protección frente a abusos del grupo de control.'},
{t:'Derechos de accionistas',d:'Derechos básicos que la entidad debe garantizar.',steps:['Voto en asamblea','Información oportuna','Dividendos','Preferencia en nuevas emisiones','Impugnar acuerdos','Transferir acciones']}]},
{ic:'tr',bg:'#F6E0F5',fg:'#9A3C98',tag:'Cómo se vigila',name:'Transparencia',intro:'Información clara, veraz y oportuna para quien tiene interés en la entidad.',items:[
{t:'Información financiera',d:'Estados financieros preparados con normas contables (NIIF) y auditados, para que sean fiables y comparables.'},
{t:'Divulgación de información',d:'Publicación oportuna y veraz de hechos relevantes, estructura de propiedad, riesgos y remuneraciones.'},
{t:'Transparencia con accionistas',d:'Informe anual, convocatorias claras a la asamblea y canales de relación con los inversionistas.'},
{t:'Transparencia con stakeholders',d:'Información a clientes, empleados, reguladores, acreedores y comunidad, incluidos los reportes de sostenibilidad.'}]}]}];
const flat=[];D.forEach((v,c)=>v.pillars.forEach((p,k)=>p.items.forEach((_,i)=>flat.push([c,k,i]))));
let idx=0,lastC=-1,lastP=-1;
const $=s=>document.querySelector(s);
function build(c){const v=D[c];
$('#tabs').innerHTML=D.map((x,j)=>`<button class="tab" role="tab" aria-selected="${j==c}" data-c="${j}">${x.tab}</button>`).join('');
$('#lead').textContent=v.lead;
$('#close').hidden=!v.close;
$('#pillars').innerHTML=v.pillars.map((p,k)=>`<button class="pillar" data-p="${k}" style="--bg2:${p.bg};--fg:${p.fg}">${IC[p.ic]}<span class="tag">${p.tag}</span><h2>${p.name}</h2><small>${p.items.length} componente${p.items.length>1?'s':''}</small></button>`).join('');}
function update(){const [c,k,i]=flat[idx];
if(c!==lastC){build(c);lastC=c;lastP=-1}
const P=D[c].pillars[k],it=P.items[i];
document.querySelectorAll('.pillar').forEach((b,j)=>b.setAttribute('aria-pressed',j==k));
$('#panel').style.cssText=`--bg2:${P.bg};--fg:${P.fg}`;
if(k!==lastP){$('#intro').textContent=P.intro;
$('#items').innerHTML=P.items.map((x,j)=>`<button class="item" data-i="${j}">${x.t}</button>`).join('');lastP=k}
document.querySelectorAll('.item').forEach((b,j)=>b.setAttribute('aria-pressed',j==i));
const pos=flat.filter(f=>f[0]==c),n=pos.findIndex(f=>f[1]==k&&f[2]==i)+1;
const d=$('#def');
d.innerHTML=`<h3>${it.t}</h3><p>${it.d}</p>${it.steps?`<div class="steps">${it.steps.map(s=>`<span>${s}</span>`).join('')}</div>`:''}<div class="nav"><span class="count">Componente ${n} de ${pos.length}</span><span class="btns"><button class="btn" id="prev">Anterior</button><button class="btn go" id="next">Siguiente</button></span></div>`;
d.classList.remove('fade');void d.offsetWidth;d.classList.add('fade');}
const go=n=>{idx=(n+flat.length)%flat.length;update()};
document.addEventListener('click',e=>{
const t=e.target.closest('button');if(!t)return;
const [c,k]=flat[idx];
if(t.classList.contains('tab')){idx=flat.findIndex(f=>f[0]==+t.dataset.c);update();$('.tab[aria-selected=true]').focus()}
else if(t.classList.contains('pillar')){idx=flat.findIndex(f=>f[0]==c&&f[1]==+t.dataset.p&&f[2]==0);update()}
else if(t.classList.contains('item')){idx=flat.findIndex(f=>f[0]==c&&f[1]==k&&f[2]==+t.dataset.i);update();document.querySelector(`.item[data-i="${t.dataset.i}"]`).focus()}
else if(t.id=='next'){go(idx+1);$('#next').focus()}
else if(t.id=='prev'){go(idx-1);$('#prev').focus()}});
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(idx+1);if(e.key=='ArrowLeft')go(idx-1)});
update();
</script>
</body>
</html>
